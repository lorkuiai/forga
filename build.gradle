plugins {
  id 'base'
  id 'com.vanniktech.maven.publish.base' version '0.37.0' apply false
}

allprojects {
  group = 'com.luokuiai.forga'
  version = findProperty('releaseVersion') ?: '1.0.0-SNAPSHOT'

  repositories {
    mavenCentral()
  }
}

subprojects {
  apply plugin: 'java-library'
  apply plugin: 'checkstyle'
  apply plugin: 'maven-publish'
  apply plugin: 'com.vanniktech.maven.publish.base'

  java {
    toolchain {
      languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
    withJavadocJar()
  }

  dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core:3.27.3'
  }

  tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all', '-Werror']
  }

  tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
  }

  tasks.withType(Test).configureEach {
    useJUnitPlatform()
  }

  checkstyle {
    toolVersion = '10.23.1'
    configFile = rootProject.file('gradle/checkstyle/checkstyle.xml')
  }

  publishing {
    publications {
      mavenJava(MavenPublication) {
        from components.java
        suppressPomMetadataWarningsFor('testFixturesApiElements')
        suppressPomMetadataWarningsFor('testFixturesRuntimeElements')

        pom {
          name = project.name
          description = "Forga authorization SDK module ${project.name}"
          url = 'https://github.com/luokuiai/forga'
          licenses {
            license {
              name = 'The Apache License, Version 2.0'
              url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
            }
          }
          developers {
            developer {
              id = 'luokuiai'
              name = 'Luokuiai'
            }
          }
          scm {
            connection = 'scm:git:git://github.com/luokuiai/forga.git'
            developerConnection = 'scm:git:ssh://git@github.com/luokuiai/forga.git'
            url = 'https://github.com/luokuiai/forga'
          }
        }
      }
    }
  }

  mavenPublishing {
    publishToMavenCentral()
    signAllPublications()
  }
}
